server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /var/www/html;
    index index.php index.html;

    # Disable access log for better performance
    access_log /var/log/nginx/prestashop_access.log;
    error_log /var/log/nginx/prestashop_error.log;

    # Gzip Settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # PrestaShop Forbidden Directories
    location ~ ^/(app|bin|cache|classes|config|controllers|docs|localization|override|src|tests|tools|translations|travis-scripts|vendor|var)/ {
        deny all;
    }

    # Images
    location ~ ^/img/.*\.(gif|jpg|jpeg|png|webp|svg)$ {
        expires 1M;
        add_header Cache-Control "public";
    }

    # CSS, JavaScript
    location ~ ^/(themes|modules)/.*\.(css|js)$ {
        expires 1M;
        add_header Cache-Control "public";
    }

    # Main location - PrestaShop rewrite rules
    location / {
        # Try to serve file directly, fallback to rewrite
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM Configuration
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # Pass to PHP-FPM container
        fastcgi_pass prestashop:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
    }

    location ~ \.(yml|log|tpl|twig|sass)$ {
        deny all;
    }
}
